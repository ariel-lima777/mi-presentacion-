<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil Gamer</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONOS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
            background: #0d1117;
        }

        .panel-steam{
            background: #161b22;
            border: 1px solid #30363d;
            color: white;
            border-radius: 10px;
        }
    </style>

</head>

<body>

<div class="container mt-4">

    <!-- CARRUSEL -->
<div id="carouselExample" class="carousel slide panel-steam p-2 mb-3" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e"
            class="d-block w-100" height="300" alt="gaming 1">
        </div>

        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1552820728-8b83bb6b773f"
            class="d-block w-100" height="300" alt="gaming 2">
        </div>

        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420"
            class="d-block w-100" height="300" alt="gaming 3">
        </div>

    </div>

    <!-- controles -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

    <!-- IMAGEN + TEXTO SEPARADOS -->
    <div class="row g-3">

        <!-- IMAGEN -->
        <div class="col-md-4">
            <div class="panel-steam p-3 text-center border border-dark">

                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/550/header.jpg"
                class="img-fluid" alt="Left 4 Dead 2">

            </div>
        </div>

        <!-- TEXTO -->
        <div class="col-md-8">
            <div class="panel-steam p-3 border border-dark d-flex align-items-center justify-content-center" style="height:100%;">

                <h2>mi juego favorito</h2>

            </div>
        </div>

    </div>

    <!-- ICONOS -->
<div class="panel-steam mt-3 p-3 text-center fs-1 border border-dark">

    <!-- TIKTOK -->
    <a href="https://www.tiktok.com" target="_blank" class="text-white m-3">
        <i class="fa-brands fa-tiktok"></i>
    </a>

    <!-- FACEBOOK -->
    <a href="https://www.facebook.com" target="_blank" class="text-primary m-3">
        <i class="fa-brands fa-facebook"></i>
    </a>

    <!-- WHATSAPP -->
    <a href="https://www.whatsapp.com" target="_blank" class="text-success m-3">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

</div>
<!-- BOOTSTRAP JS (OBLIGATORIO PARA CARRUSEL) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
